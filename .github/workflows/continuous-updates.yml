name: Continuous updater packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janeconverter-continuous-updates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  prepare:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.build-info.outputs.version }}
      commit: ${{ steps.build-info.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Verify update signing configuration
        env:
          JANECONVERTER_UPDATER_PUBKEY: ${{ vars.JANECONVERTER_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$JANECONVERTER_UPDATER_PUBKEY" ]; then
            echo "Configure the JANECONVERTER_UPDATER_PUBKEY repository variable."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Configure the TAURI_SIGNING_PRIVATE_KEY repository secret."
            exit 1
          fi
      - name: Compute the commit build version
        id: build-info
        run: |
          uv sync --locked
          version="$(uv run --locked python -c 'from janeconverter.version import __version__; print(__version__)')+build.${GITHUB_RUN_NUMBER}.g${GITHUB_SHA}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  windows-x64:
    needs: prepare
    runs-on: windows-latest
    env:
      JANECONVERTER_BUILD_COMMIT: ${{ needs.prepare.outputs.commit }}
      JANECONVERTER_UPDATER_PUBKEY: ${{ vars.JANECONVERTER_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          architecture: x64
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json
      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install Python build dependencies
        run: uv sync --locked
      - name: Download and verify static FFmpeg
        id: ffmpeg
        shell: pwsh
        run: |
          $tag = "autobuild-2026-09-30-13-08"
          $name = "ffmpeg-N-127021-ge0c94b2d1c-win64-gpl.zip"
          $expected = "85c4a4636b93d681a07588ffa6f1d8f5c064d9c3fb0622066662906b6fd718a1"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/$tag/$name"
          Invoke-WebRequest -Uri $url -OutFile $name
          $actual = (Get-FileHash -Algorithm SHA256 $name).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg SHA256 verification failed." }
          Expand-Archive -LiteralPath $name -DestinationPath ffmpeg-static
          $ffmpeg = (Get-ChildItem ffmpeg-static -Recurse -Filter ffmpeg.exe -File | Select-Object -First 1).FullName
          $ffprobe = (Get-ChildItem ffmpeg-static -Recurse -Filter ffprobe.exe -File | Select-Object -First 1).FullName
          if (-not $ffmpeg -or -not $ffprobe) { throw "Verified FFmpeg archive did not contain both tools." }
          "ffmpeg=$ffmpeg" >> $env:GITHUB_OUTPUT
          "ffprobe=$ffprobe" >> $env:GITHUB_OUTPUT
      - name: Build signed updater package
        shell: pwsh
        env:
          UPDATER_VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ./packaging/build_consumer.ps1 `
            -UpdaterOnly `
            -UpdaterBuildVersion $env:UPDATER_VERSION `
            -BuildCommit $env:JANECONVERTER_BUILD_COMMIT `
            -FFmpegPath "${{ steps.ffmpeg.outputs.ffmpeg }}" `
            -FFprobePath "${{ steps.ffmpeg.outputs.ffprobe }}" `
            -NodePath (Get-Command node.exe).Source
      - uses: actions/upload-artifact@v4
        with:
          name: updater-windows-x64
          if-no-files-found: error
          path: |
            dist/JaneConverter-continuous-windows-x64-setup.exe
            dist/JaneConverter-continuous-windows-x64-setup.exe.sig

  linux-x86_64:
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      JANECONVERTER_BUILD_COMMIT: ${{ needs.prepare.outputs.commit }}
      JANECONVERTER_UPDATER_PUBKEY: ${{ vars.JANECONVERTER_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json
      - name: Install Tauri and AppImage prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libfuse2 libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf wget xz-utils
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install Python build dependencies
        run: uv sync --locked
      - name: Download and verify static FFmpeg
        id: ffmpeg
        run: |
          set -euo pipefail
          tag=autobuild-2026-09-30-13-08
          name=ffmpeg-N-127021-ge0c94b2d1c-linux64-gpl.tar.xz
          expected=3a2a94e704752287833604501a79505c2319ad1d8b2f5577c63f2b1b7a6f2b66
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/$tag/$name"
          curl --fail --location --retry 3 --output "$name" "$url"
          actual="$(sha256sum "$name" | cut -d' ' -f1)"
          test "$actual" = "$expected"
          mkdir ffmpeg-static
          tar -xJf "$name" -C ffmpeg-static
          ffmpeg="$(find "$PWD/ffmpeg-static" -type f -name ffmpeg -perm -111 -print -quit)"
          ffprobe="$(find "$PWD/ffmpeg-static" -type f -name ffprobe -perm -111 -print -quit)"
          test -n "$ffmpeg" && test -n "$ffprobe"
          echo "ffmpeg=$ffmpeg" >> "$GITHUB_OUTPUT"
          echo "ffprobe=$ffprobe" >> "$GITHUB_OUTPUT"
      - name: Build signed updater AppImage
        env:
          UPDATER_VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bash packaging/build_linux.sh \
            --updater-only \
            --updater-version "$UPDATER_VERSION" \
            --build-commit "$JANECONVERTER_BUILD_COMMIT" \
            --ffmpeg "${{ steps.ffmpeg.outputs.ffmpeg }}" \
            --ffprobe "${{ steps.ffmpeg.outputs.ffprobe }}" \
            --node "$(command -v node)"
      - uses: actions/upload-artifact@v4
        with:
          name: updater-linux-x86_64
          if-no-files-found: error
          path: |
            dist/JaneConverter-continuous-linux-x86_64.AppImage
            dist/JaneConverter-continuous-linux-x86_64.AppImage.sig

  macos:
    needs: prepare
    name: updater-macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            python-architecture: arm64
            node-architecture: arm64
            ffmpeg-asset: ffmpeg-darwin-arm64
            ffmpeg-url: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64
            ffmpeg-sha256: a90e3db6a3fd35f6074b013f948b1aa45b31c6375489d39e572bea3f18336584
            ffprobe-asset: ffprobe-darwin-arm64
            ffprobe-url: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-darwin-arm64
            ffprobe-sha256: bb2db6f5d8cef919da12fbf592119a987202a8c060a886f3cab091f9cab90b64
          - arch: x86_64
            runner: macos-15-intel
            python-architecture: x64
            node-architecture: x64
            ffmpeg-asset: ffmpeg-darwin-x64
            ffmpeg-url: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-x64
            ffmpeg-sha256: ebdddc936f61e14049a2d4b549a412b8a40deeff6540e58a9f2a2da9e6b18894
            ffprobe-asset: ffprobe-darwin-x64
            ffprobe-url: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-darwin-x64
            ffprobe-sha256: fa3add0ce901f7241abe0dfc0155d958fc834aca3f8ce61f87cc712ae669c1e0
    runs-on: ${{ matrix.runner }}
    env:
      JANECONVERTER_BUILD_COMMIT: ${{ needs.prepare.outputs.commit }}
      JANECONVERTER_UPDATER_PUBKEY: ${{ vars.JANECONVERTER_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-architecture }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          architecture: ${{ matrix.node-architecture }}
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json
      - name: Verify native runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install Python build dependencies
        run: uv sync --locked
      - name: Download and verify FFmpeg tools
        id: ffmpeg
        run: |
          set -euo pipefail
          mkdir ffmpeg-static
          ffmpeg="ffmpeg-static/${{ matrix.ffmpeg-asset }}"
          ffprobe="ffmpeg-static/${{ matrix.ffprobe-asset }}"
          curl --fail --location --retry 3 --output "$ffmpeg" "${{ matrix.ffmpeg-url }}"
          curl --fail --location --retry 3 --output "$ffprobe" "${{ matrix.ffprobe-url }}"
          printf '%s  %s\n' '${{ matrix.ffmpeg-sha256 }}' "$ffmpeg" | shasum -a 256 -c -
          printf '%s  %s\n' '${{ matrix.ffprobe-sha256 }}' "$ffprobe" | shasum -a 256 -c -
          chmod 0755 "$ffmpeg" "$ffprobe"
          echo "ffmpeg=$PWD/$ffmpeg" >> "$GITHUB_OUTPUT"
          echo "ffprobe=$PWD/$ffprobe" >> "$GITHUB_OUTPUT"
      - name: Build signed updater app
        env:
          UPDATER_VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bash packaging/build_macos.sh \
            --updater-only \
            --updater-version "$UPDATER_VERSION" \
            --build-commit "$JANECONVERTER_BUILD_COMMIT" \
            --ffmpeg "${{ steps.ffmpeg.outputs.ffmpeg }}" \
            --ffprobe "${{ steps.ffmpeg.outputs.ffprobe }}" \
            --node "$(command -v node)"
      - uses: actions/upload-artifact@v4
        with:
          name: updater-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/JaneConverter-continuous-macos-${{ matrix.arch }}.app.tar.gz
            dist/JaneConverter-continuous-macos-${{ matrix.arch }}.app.tar.gz.sig

  publish:
    needs: [prepare, windows-x64, linux-x86_64, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Create and validate the complete signed update feed
        env:
          UPDATER_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          uv run --locked --no-sync python packaging/create_updater_manifest.py \
            --version "$UPDATER_VERSION" \
            --commit "$SOURCE_COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --artifacts-dir artifacts \
            --output artifacts/latest.json
      - name: Publish the rolling continuous update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view continuous --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload continuous artifacts/JaneConverter* --repo "$GITHUB_REPOSITORY" --clobber
            gh release upload continuous artifacts/latest.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create continuous artifacts/JaneConverter* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "JaneConverter Continuous Updates" \
              --notes "Signed per-commit update packages for the JaneConverter desktop app."
            gh release upload continuous artifacts/latest.json --repo "$GITHUB_REPOSITORY"
          fi
