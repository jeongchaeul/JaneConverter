name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "autobuild-2026-09-30-13-08"
          $name = "ffmpeg-N-127021-ge0c94b2d1c-win64-gpl.zip"
          $expected = "85c4a4636b93d681a07588ffa6f1d8f5c064d9c3fb0622066662906b6fd718a1"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/$tag/$name"
          Invoke-WebRequest -Uri $url -OutFile $name
          $actual = (Get-FileHash -Algorithm SHA256 $name).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg SHA256 verification failed." }
          Expand-Archive -LiteralPath $name -DestinationPath ffmpeg-static
          $ffmpeg = (Get-ChildItem ffmpeg-static -Recurse -Filter ffmpeg.exe -File | Select-Object -First 1).FullName
          if (-not $ffmpeg) { throw "Verified FFmpeg archive did not contain ffmpeg.exe." }
          $binDir = Split-Path $ffmpeg
          $binDir >> $env:GITHUB_PATH

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          mkdir -p "$HOME/.local/bin"
          if [ "$arch" = "arm64" ]; then
            curl -fsSL --retry 3 https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64 -o "$HOME/.local/bin/ffmpeg"
            curl -fsSL --retry 3 https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-darwin-arm64 -o "$HOME/.local/bin/ffprobe"
          else
            curl -fsSL --retry 3 https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-x64 -o "$HOME/.local/bin/ffmpeg"
            curl -fsSL --retry 3 https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-darwin-x64 -o "$HOME/.local/bin/ffprobe"
          fi
          chmod +x "$HOME/.local/bin/ffmpeg" "$HOME/.local/bin/ffprobe"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify dependencies
        run: uv pip check

      - name: Lint with pyflakes
        run: uv run --locked pyflakes src/janeconverter packaging/engine_entry.py

      - name: Run hermetic test suite
        run: uv run --locked pytest tests/ -v

      - name: Run online tests (opt-in)
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        run: uv run --locked pytest tests/ -m online -v

  desktop:
    name: Desktop UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json
      - name: Test Browser Bridge
        run: node --test browser-extension/test/*.test.js
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: desktop-ui
        run: npm ci
      - name: Run frontend tests
        working-directory: desktop-ui
        run: npm run test
      - name: Build frontend
        working-directory: desktop-ui
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop-ui/src-tauri/Cargo.toml --check
      - name: Run Tauri tests
        run: cargo test --manifest-path desktop-ui/src-tauri/Cargo.toml
